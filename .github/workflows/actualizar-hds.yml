name: Actualizar HDS y publicar portal
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
  push:
    branches: [main]
    paths:
      - index.html
      - app.js
      - styles.css
      - data.js
      - scripts/actualizar_hds.py
      - .github/workflows/actualizar-hds.yml
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: portal-hds-pages
  cancel-in-progress: false
jobs:
  actualizar-y-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar lector PDF
        run: python -m pip install 'pymupdf>=1.24,<2'
      - name: Leer HDS y actualizar fichas
        run: python scripts/actualizar_hds.py
      - name: Guardar cambios en los datos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.js
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar fichas desde las HDS de Drive'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publicar portal
        id: deployment
        uses: actions/deploy-pages@v4
